<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Canvas Resources</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <header>
      <div class="title-row">
        <img src="icons/icon128.png" class="logo-icon" alt="Canvas Resources Logo">
        <h1>Course Resources</h1>
      </div>
      <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Search files...">
      </div>
    </header>

    <div id="file-list">
      <div class="message-placeholder">
        <svg class="empty-state-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"></path>
        </svg>
        <p>Navigate to a specific course page like Modules or Home to start finding files!</p>
      </div>
    </div>
    
    <div id="status-footer" class="status-footer" style="display: none;">
      <!-- Populated by JS -->
    </div>

    <footer>
      <div class="footer-content">
        <button id="btn-bulk-download" class="btn-primary">
          Download All Files
        </button>
        
        <button id="btn-feedback" class="btn-text-only">
          Report an issue / Feedback
        </button>
      </div>
    </footer>

    <!-- Deep Scan Modal Removed -->

    <!-- Feedback Modal -->
    <div id="feedback-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <button id="feedback-close" class="modal-close">&times;</button>
        <div class="modal-header">
          <h2>💬 Send Feedback</h2>
        </div>
        <div class="modal-body">
          <p>Found a bug? Have a feature request? Let me know directly.</p>
          
          <div id="feedback-form-container">
            <select id="feedback-type" class="modal-input">
              <option value="Bug Report">🐛 Bug Report</option>
              <option value="Feature Request" selected>✨ Feature Request</option>
              <option value="Question">❓ General Question</option>
            </select>
            
            <textarea id="feedback-message" class="modal-input" rows="4" placeholder="Tell me what's on your mind..."></textarea>
            
            <input type="email" id="feedback-email" placeholder="Your Email (optional)" class="modal-input">
            
            <button id="btn-send-feedback" class="btn-cta">Send Message</button>
          </div>

          <div id="feedback-success" style="display: none;">
            <p class="success-msg">🎉 Thanks! I've received your message.</p>
          </div>
        </div>
      </div>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
